name: autonexoowner
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # HTTP & API
  http: ^1.1.0
  http_parser: ^4.0.2
  
  # Image Picker
  image_picker: ^1.0.7
  
  # Location
  geolocator: ^10.1.0
  
  # Maps
  google_maps_flutter: ^2.5.0
  
  # URL Launcher
  url_launcher: ^6.2.0
  
  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Logo_Autonexoo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
